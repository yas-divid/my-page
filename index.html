<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة حب ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    direction:rtl;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ffb6d9,#ffd6ec);
    background-size:400% 400%;
    animation:bg 10s infinite alternate;
}

/* حركة الخلفية */
@keyframes bg{
    0%{
        background-position:left;
    }
    100%{
        background-position:right;
    }
}

/* الصندوق */
.box{
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(0,0,0,0.2);
    z-index:2;
}

/* الصورة */
img{
    width:120px;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* السؤال */
h1{
    color:white;
    font-size:28px;
    margin-bottom:25px;
    text-shadow:0 0 10px #ff1493;
}

/* الأزرار */
button{
    border:none;
    border-radius:15px;
    padding:12px 25px;
    margin:10px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
    color:white;
}

.yes{
    background:#ff1493;
}

.no{
    background:#666;
}

button:hover{
    transform:scale(1.1);
}

/* الرسالة */
#message{
    color:white;
    font-size:22px;
    line-height:2;
    white-space:pre-line;
    text-shadow:0 0 8px #ff1493;
}

/* القلوب */
.heart{
    position:absolute;
    bottom:-50px;
    color:red;
    animation:float linear forwards;
}

@keyframes float{
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- موسيقى -->
<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8e2b3b1.mp3?filename=romantic-love-11786.mp3">
</audio>

<div class="box">

<img src="https://cdn-icons-png.flaticon.com/512/833/833472.png">

<h1 id="question">هل تحبني؟ ❤️</h1>

<div id="buttons">
    <button class="yes" onclick="nextQuestion()">نعم 💖</button>
    <button class="no" onclick="showOnlyYes()">لا 😢</button>
</div>

<div id="message"></div>

</div>

<script>

/* الأسئلة */

let questions = [
    "هل تحبني؟ ❤️",
    "هل أنا مميز لديك؟ 🌸",
    "هل ستبقى معي دائما؟ 🥺",
    "هل تريد رؤية الرسالة الأخيرة؟ 💌"
];

let current = 0;

/* زر نعم */

function nextQuestion(){

    current++;

    if(current < questions.length){

        document.getElementById("question").innerText = questions[current];

    }else{

        document.getElementById("question").style.display = "none";
        document.getElementById("buttons").style.display = "none";

        document.getElementById("message").innerText =
`أنت قلبي وروحي وسندي ❤️

قد لا اكون افضل شخص لكنني تذكري انا دائما معك
ساستمع لك دائما

احبك كثيرااا "ن"
احبببك كثيرااا

انت روحي وعمري وقلبي وبحري وكل شيء
انت دنياي وكل شيء
انت عالمي الخاص ❤️`;
    }

}

/* عند الضغط على لا */

function showOnlyYes(){

    document.getElementById("question").innerText =
    "لا يوجد خيار آخر 😌❤️";

    document.getElementById("buttons").innerHTML =
    `<button class="yes" onclick="nextQuestion()">حسنا... نعم 💖</button>`;
}

/* القلوب المتطايرة */

function createHeart(){

    let heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize = (20 + Math.random() * 25) + "px";

    heart.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(createHeart,300);

</script>

</body>
    </html>
