<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة شهر العسل ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    direction:rtl;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff7eb3,#ff758c,#ffb199,#ffd6ec);
    background-size:400% 400%;
    animation:bg 10s infinite alternate;
}

@keyframes bg{
    0%{background-position:left;}
    100%{background-position:right;}
}

.box{
    width:90%;
    max-width:430px;
    padding:30px;
    border-radius:30px;
    text-align:center;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    box-shadow:0 0 25px rgba(0,0,0,0.2);
    z-index:2;
    animation:show 1s ease;
}

@keyframes show{
    from{
        transform:scale(0.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

img{
    width:110px;
    margin-bottom:15px;
    animation:float 2s infinite alternate;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(-10px);}
}

h1{
    color:white;
    font-size:28px;
    margin-bottom:25px;
    text-shadow:0 0 10px #ff1493;
}

button{
    display:block;
    width:100%;
    border:none;
    padding:14px;
    margin:10px 0;
    border-radius:15px;
    font-size:19px;
    cursor:pointer;
    transition:0.3s;
    color:white;
    background:#ff1493;
}

button:hover{
    transform:scale(1.05);
    background:#ff69b4;
}

#result{
    color:white;
    font-size:22px;
    line-height:2;
    white-space:pre-line;
    text-shadow:0 0 8px #ff1493;
}

/* القلوب */

.heart{
    position:absolute;
    color:red;
    animation:hearts linear forwards;
    opacity:0.8;
}

@keyframes hearts{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="box">

<img src="https://cdn-icons-png.flaticon.com/512/742/742751.png">

<h1 id="question">
أين تودين قضاء شهر العسل؟ ❤️
</h1>

<div id="answers">

<button onclick="next('سويسرا 🇨🇭')">
سويسرا 🇨🇭
</button>

<button onclick="next('فرنسا 🇫🇷')">
فرنسا 🇫🇷
</button>

<button onclick="next('إسبانيا 🇪🇸')">
إسبانيا 🇪🇸
</button>

<button onclick="next('المالديف 🏝️')">
المالديف 🏝️
</button>

</div>

<div id="result"></div>

</div>

<script>

let step = 0;

let choices = {};

/* الأسئلة */

const questions = [

{
q:"ما أجمل شيء تريدين فعله هناك؟ 💕",
answers:[
"مشاهدة الغروب 🌅",
"عشاء رومانسي 🍷",
"التجول معا 🚶‍♂️❤️🚶‍♀️",
"التقاط الصور 📸"
]
},

{
q:"أي هدية تريدين مني؟ 🎁",
answers:[
"خاتم 💍",
"وردة 🌹",
"رسالة حب 💌",
"عناق طويل 🤗"
]
},

{
q:"ما الأغنية التي سنرقص عليها؟ 🎶",
answers:[
"أغنية رومانسية هادئة ❤️",
"أغنية BTS 💜",
"أغنية حزينة قليلا 🥺",
"أي شيء معك جميل ✨"
]
}

];

/* الانتقال */

function next(answer){

    choices["step"+step] = answer;

    step++;

    if(step <= questions.length){

        showQuestion();

    }else{

        showFinal();
    }
}

/* عرض السؤال */

function showQuestion(){

    let current = questions[step-1];

    document.getElementById("question").innerText =
    current.q;

    let html = "";

    current.answers.forEach(a=>{

        html += `
        <button onclick="next('${a}')">
        ${a}
        </button>
        `;
    });

    document.getElementById("answers").innerHTML =
    html;
}

/* النهاية */

function showFinal(){

    document.getElementById("question").style.display =
    "none";

    document.getElementById("answers").style.display =
    "none";

    document.getElementById("result").innerText =
`❤️ خطتنا المثالية ❤️

سنذهب معا إلى ${choices.step0}

وسنشاهد أجمل اللحظات معا ✨

وسأهديك ${choices.step2}

وسنرقص على ${choices.step3}

لكن بصراحة...
أي مكان معك يصبح جنة ❤️`;
}

/* القلوب */

function createHeart(){

    let heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";

    heart.style.fontSize =
    (20 + Math.random()*30)+"px";

    heart.style.animationDuration =
    (4 + Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,250);

</script>

</body>
</html>
